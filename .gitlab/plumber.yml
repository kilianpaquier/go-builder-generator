    # Flags project CI/CD variables not protected.
    # Needs a GitLab API token with variables read access, reports not-evaluable otherwise.
    cicdVariablesMustBeProtected:
      enabled: true

    # Flags project CI/CD variables not masked, including values under 8 characters.
    cicdVariablesMustBeMasked:
      enabled: true

    # Needs a GitLab API token, abstains otherwise.
    branchMustBeProtected:
      enabled: true
      defaultMustBeProtected: true
      namePatterns:
        - dev
        - develop
        - main
        - master
        - production
        - release/*
        - staging
      allowForcePush: false
      codeOwnerApprovalRequired: true
      # Minimum access level to merge (0=No one, 30=Developer, 40=Maintainer)
      minMergeAccessLevel: 30
      # Minimum access level to push (same values)
      minPushAccessLevel: 40

    # Premium/Ultimate only (passes vacuously on Free).
    mergeRequestApprovalRulesMustRequireMinimumApprovals:
      enabled: false
      minimumRequiredApprovals: 1

    # Premium/Ultimate only (fires on Free, where the approvals API returns an empty list).
    mergeRequestApprovalRulesMustCoverAllProtectedBranches:
      enabled: false

    # Checks approval settings against the expectations below (unset ones are skipped).
    # Premium/Ultimate only (fires on every run on Free), checks nothing while all are commented out.
    mergeRequestApprovalSettingsMustBeCompliant:
      enabled: true
      # preventApprovalByAuthor: true
      # preventApprovalsByCommitters: true
      # preventEditingApprovalRulesInMR: true
      # requireReAuthToApprove: true
      # Strictness: keep_approvals < remove_approvals_by_code_owners < remove_all_approvals (default).
      # behaviorWhenCommitIsAdded: remove_all_approvals

    # mergePipelinesEnabled and mergeTrainsEnabled are Premium/Ultimate only.
    mergeRequestSettingsMustBeCompliant:
      enabled: true
      mergeMethod: ff # merge, ff or rebase_merge
      squashOption: never # never, always, default_on or default_off
      mergePipelinesEnabled: true
      mergeTrainsEnabled: true
      allowMergeOnSkippedPipeline: true
      # resolveOutdatedDiffDiscussions: true
      # printingMergeRequestLinkEnabled: true
      removeSourceBranchAfterMerge: true

    # Requires the project to link a security policy project, optionally a specific one (the ID wins if both are set).
    # Ultimate only (fires on lower tiers).
    projectMustHaveSecurityPolicySource:
      enabled: false
      # expectedProjectId: 123
      # expectedProjectPath: my-group/security-policy-project

    # Detects CI/CD jobs defined directly in .gitlab-ci.yml instead of being included from components or templates.
    pipelineMustNotIncludeHardcodedJobs:
      enabled: false

    # Flags include refs resolving upstream as both tag and branch (pin to a 40-char commit SHA).
    # Needs a GitLab API token, abstains otherwise.
    externalRefsMustNotCollide:
      enabled: true

    # Detects CI/CD includes from the GitLab CI Catalog not using the latest available version.
    includesMustBeUpToDate:
      enabled: true

    # Detects CI/CD includes using mutable version references.
    includesMustNotUseForbiddenVersions:
      enabled: true
      forbiddenVersions:
        - "~latest"
        - dev
        - develop
        - HEAD
        - latest
        - main
        - master
        - staging
      # Also forbids the project's default branch.
      defaultBranchIsForbiddenVersion: true

    # Requires the given components, checks nothing when empty.
    # Use one of (see https://github.com/getplumber/plumber/blob/main/configuration/expression_test.go):
    #   required: (components/sast/sast AND components/secret-detection/secret-detection) OR your-org/full-security/full-security
    #   requiredGroups: [["components/sast/sast", "components/secret-detection/secret-detection"], ["your-org/full-security-pipeline/full-security"]]
    pipelineMustIncludeComponent:
      enabled: true
      # required: components/sast/sast AND components/secret-detection/secret-detection AND getplumber/plumber/plumber
      requiredGroups: []

    # Requires the given project file includes, checks nothing when empty.
    # Use one of:
    #   required: (templates/go/go AND templates/trivy/trivy) OR templates/full-go-pipeline
    #   requiredGroups: [["templates/go/go", "templates/trivy/trivy"], ["templates/full-go-pipeline"]]
    pipelineMustIncludeTemplate:
      enabled: true
      # required: templates/go/go AND templates/trivy/trivy AND templates/iso27001/iso27001
      requiredGroups: []

    # Flags `include: component:` sources not trusted below (`remote:` and `project:` includes aren't checked).
    componentMustComeFromAuthorizedSources:
      enabled: true
      trustSameGroupComponents: true
      # Ignored on gitlab.com.
      trustSameInstanceComponents: true
      trustGitlabOfficialComponents: true # gitlab.com/components/* and gitlab.com/gitlab-org/*
      trustedComponents:
        - gitlab.com/getplumber/*
        - gitlab.com/to-be-continuous/*

    # Flags `run:` step `func:` references (GitLab CI Functions) not trusted below.
    functionMustComeFromAuthorizedSources:
      enabled: true
      trustSameGroupFunctions: true
      # The runner doesn't expand $VAR in `func:` references, list literal hosts and paths.
      trustedFunctions: []

    # Flags debug variables set to "true", which print every environment variable (secrets included) in job logs.
    pipelineMustNotEnableDebugTrace:
      enabled: true
      forbiddenVariables:
        - CI_DEBUG_TRACE
        - CI_DEBUG_SERVICES

    # Flags user-controlled CI variables passed to commands that re-interpret input as shell code (eval, sh -c, etc.).
    # Indirect aliasing (BRANCH: $CI_COMMIT_BRANCH then sh -c $BRANCH) isn't tracked.
    pipelineMustNotUseUnsafeVariableExpansion:
      enabled: true
      dangerousVariables:
        - CI_MERGE_REQUEST_TITLE
        - CI_MERGE_REQUEST_DESCRIPTION
        - CI_COMMIT_MESSAGE
        - CI_COMMIT_TITLE
        - CI_COMMIT_TAG_MESSAGE
        - CI_COMMIT_REF_NAME
        - CI_COMMIT_REF_SLUG
        - CI_COMMIT_BRANCH
        - CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
        - CI_EXTERNAL_PULL_REQUEST_SOURCE_BRANCH_NAME
      # Allow with patterns (escape $ as \\$, {} as \\{ \\} in patterns):
      # allowedPatterns:
      #   - "helm.*--set.*\\$CI_"
      allowedPatterns: []

    # Detects security scanning jobs neutralized through overrides (allow_failure, when: never / manual).
    securityJobsMustNotBeWeakened:
      securityJobPatterns:
        - "*-sast"
        - "secret_detection"
        - "container_scanning"
        - "*_dependency_scanning"
        - "gemnasium-*"
        - "dast"
        - "dast_*"
        - "license_scanning"
      allowFailureMustBeFalse:
        enabled: true
      rulesMustNotBeRedefined:
        enabled: true
      whenMustNotBeManual:
        enabled: true

    # Detects controlled variables redefined in .gitlab-ci.yml instead of GitLab CI/CD Settings.
    pipelineMustNotOverrideJobVariables:
      enabled: true
      variables:
        - SECURE_ANALYZERS_PREFIX
        - SAST_DISABLED
        - SAST_EXCLUDED_PATHS
        - SAST_EXCLUDED_ANALYZERS
        - SECRET_DETECTION_DISABLED
        - SECRET_DETECTION_EXCLUDED_PATHS
        - CONTAINER_SCANNING_DISABLED
        - DAST_DISABLED
        - DEPENDENCY_SCANNING_DISABLED
        - LICENSE_SCANNING_DISABLED
        # - MY_CUSTOM_PROTECTED_VAR

    # Flags jobs downloading or executing scripts without integrity verification (curl | bash, etc.).
    pipelineMustNotExecuteUnverifiedScripts:
      enabled: true
      trustedUrls: []
      # - https://internal-artifacts.example.com/*

    pipelineMustNotUseDockerInDocker:
      enabled: true
      # Also flags insecure daemon config (DOCKER_TLS_CERTDIR="" or DOCKER_HOST tcp://...:2375).
      detectInsecureDaemon: true
